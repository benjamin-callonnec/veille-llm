[project]
name = "veille-llm"
version = "0.20.0"
description = "Personal tech watch on LLM research and news: daily pipeline, static catalogue, weekly newsletter"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.14",
    "jinja2>=3.1.6",
]

[project.scripts]
veille-core = "veille_llm.pipeline.run:main"
veille-newsletter = "veille_llm.newsletter.cli:main"
veille-reader = "veille_reader.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6.0.4",
    "ruff>=0.6",
]
reader = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "websockets>=13",
    "httpx>=0.27",
    "pypdf>=7.0.1,<7.1",
    "pdfminer-six>=20240706",
]
llm = [
    "claude-agent-sdk>=0.2.187",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veille_llm", "src/veille_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=veille_llm --cov=veille_reader --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
default-groups = ["dev", "llm", "reader"]
