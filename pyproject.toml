[project]
name = "veille-llm"
version = "0.4.1"
description = "Personal tech watch on LLM research and news: daily pipeline, static catalogue, weekly newsletter"
requires-python = ">=3.11"
dependencies = [
    "feedparser>=6.0.14",
]

[project.scripts]
veille-core = "veille_llm.pipeline.run:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pyyaml>=6.0.4",
    "ruff>=0.6",
]
llm = [
    "claude-agent-sdk>=0.2.187",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/veille_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=veille_llm --cov-report=term-missing"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.uv]
default-groups = ["dev", "llm"]
