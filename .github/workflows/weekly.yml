name: weekly

# Send the weekly newsletter (one mail per subscriber), once per ISO week, then persist the
# delivery counters in veille.db on the `data` branch. Triggers: schedule and manual only
# (this workflow holds secrets: never PR/issue triggers).
on:
  schedule:
    - cron: "0 8 * * 1" # Monday 08:00 UTC, after the 06:00 daily run
  workflow_dispatch:

permissions:
  contents: read

# Same group as daily.yml: a single writer of the `data` branch at a time.
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  send:
    # Manual runs from another branch would run untested code with the secrets.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # no write token in the job that holds the SMTP and subscriber secrets
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Restore veille.db from the data branch (public, no token needed)
        run: uv run python -m veille_llm.persist restore veille.db "https://github.com/${{ github.repository }}.git"
      - name: Send the newsletter (addresses are masked, never printed)
        env:
          SUBSCRIBERS: ${{ secrets.SUBSCRIBERS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NEWSLETTER_FROM: ${{ secrets.NEWSLETTER_FROM }}
          NEWSLETTER_CONTACT: ${{ secrets.NEWSLETTER_CONTACT }}
        run: uv run veille-newsletter send --db veille.db
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('veille.db') != '' }}
        with:
          name: database
          path: veille.db
          retention-days: 1

  persist:
    # Even when sending failed half way: the counters let a rerun resume without duplicates.
    needs: send
    if: ${{ always() && needs.send.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only to push the orphan `data` branch; no third-party code here
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: database
      - name: Publish veille.db to the data branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: PYTHONPATH=src python3 -m veille_llm.persist publish veille.db "$REMOTE"
