name: daily

# Collect, classify with the LLM, persist veille.db on the `data` branch, deploy Pages.
# Triggers: schedule and manual only (this workflow holds secrets: never PR/issue triggers).
# It is the only Pages deployer (builds web/); to redeploy after a push, run it manually.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One writer of the `data` branch at a time (the weekly newsletter will share this group).
concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  core:
    # Manual runs from another branch would run untested code with the secret.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # no write token in the job that runs third-party code
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Restore veille.db from the data branch (public, no token needed)
        run: uv run python -m veille_llm.persist restore veille.db "https://github.com/${{ github.repository }}.git"
      - name: Run the pipeline (fails visibly if the LLM stops)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run veille-core run --db veille.db --out build/catalogue.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() && hashFiles('veille.db') != '' }}
        with:
          name: database
          path: veille.db
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: catalogue
          path: build/catalogue.json
          if-no-files-found: warn

  persist:
    # Even when the run failed: the verdicts already paid for must not be lost.
    needs: core
    if: ${{ always() && needs.core.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # only to push the orphan `data` branch; no third-party code here
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: database
      - name: Publish veille.db to the data branch
        env:
          REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: PYTHONPATH=src python3 -m veille_llm.persist publish veille.db "$REMOTE"

  build-web:
    # Third-party npm code runs here, with read-only access and no Pages token.
    needs: core
    if: ${{ !cancelled() && needs.core.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run build
        working-directory: web
      # No catalogue (pipeline crashed before exporting): fail and keep the live site as it is.
      - uses: actions/download-artifact@v4
        with:
          name: catalogue
          path: web/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    # Only publishes the built artifact: no checkout, no Node, no third-party build code.
    needs: [persist, build-web]
    if: ${{ !cancelled() && needs.build-web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
