name: spike-llm

# Manual only. Proves the Claude Agent SDK runs headless on the subscription token.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spike:
    # The Cloudflare Worker's GitHub token can dispatch this workflow on any branch: run only main's code.
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Run the LLM spike
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run python scripts/spike_llm.py
