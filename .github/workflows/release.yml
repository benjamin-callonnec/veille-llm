name: release

# Tags vX.Y.Z (version from pyproject.toml) and publishes a GitHub release whose
# description is the matching CHANGELOG.md section. Only workflow with write access;
# it uses no secret other than the automatic GITHUB_TOKEN.
on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Create the release if the version has none
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          tag="v${version}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, nothing to do."
            exit 0
          fi
          PYTHONPATH=src python3 -m veille_llm.release notes CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$tag" --target "$SHA" --title "$tag" --notes-file notes.md
